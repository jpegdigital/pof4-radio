<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0c0d18}
.card{position:relative;width:1200px;height:630px;overflow:hidden;
 background:radial-gradient(ellipse at 78% 60%,#6a2c5e 0,#241a3c 45%,#0c0d18 80%)}
.grid{position:absolute;left:-20%;width:140%;bottom:-110px;height:190px;transform:perspective(220px) rotateX(52deg);
 background-image:linear-gradient(#ff7fb870 2px,transparent 2px),linear-gradient(90deg,#ff7fb870 2px,transparent 2px);
 background-size:60px 40px;-webkit-mask-image:linear-gradient(transparent,#000 40%)}
.horizon{position:absolute;left:0;right:0;top:548px;height:3px;background:#ffb3d2;box-shadow:0 0 18px #ff8fc0,0 0 40px #ff7fb8}
.mark{position:absolute;right:92px;top:92px;width:380px;height:380px;filter:drop-shadow(0 30px 60px #000a) drop-shadow(0 0 60px #f06f9640)}
.text{position:absolute;left:88px;top:96px}
.eyebrow{font:500 20px 'IBM Plex Mono',monospace;letter-spacing:6px;color:#91e8dc;text-transform:uppercase;display:flex;align-items:center;gap:14px}
.eyebrow i{width:10px;height:10px;border-radius:50%;background:#91e8dc;box-shadow:0 0 14px #91e8dc}
h1{margin:22px 0 0;font:700 150px/0.88 'Barlow Condensed',sans-serif;letter-spacing:-2px;color:#f7eef6;text-transform:uppercase}
h1 span{display:block;background:linear-gradient(#ffe0a3,#ff9a86 50%,#f06f96);-webkit-background-clip:text;color:transparent}
p{margin:26px 0 0;font:500 34px 'Barlow Condensed',sans-serif;color:#d6c6dc;letter-spacing:.5px}
</style></head><body><div class="card">
<div class="grid"></div><div class="horizon"></div>
<div class="text"><div class="eyebrow"><i></i>On air · your wavelength</div><h1>Claude<span>Radio</span></h1><p>An AI DJ over your records.</p></div>
<img class="mark" src="mark.svg" alt="">
</div></body></html>
